name: market
on:
  schedule:
    - cron: "*/15 0-7 * * 1-5"   # 9:00-16:59 JST, weekdays
  workflow_dispatch:
permissions:
  contents: write
concurrency: market
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/market.py
      - name: Publish to the data branch
        run: |
          mkdir /tmp/out && cp market.json /tmp/out/
          cd /tmp/out
          git init -q -b data
          git config user.name "fineri-bot"
          git config user.email "fineri-bot@users.noreply.github.com"
          git add market.json
          git commit -qm "market $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
