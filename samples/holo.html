<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HOLOGRAM 見本</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--c:#8ff3ff;--p:#c9a7ff;--fg:#f0fbff;--mut:#9fc2d6;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--fg);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:hidden;
  background:linear-gradient(180deg,rgba(6,14,30,.55),rgba(6,10,24,.92)),url(../forest.jpg) center/cover fixed,#060b18}
.wrap{max-width:900px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 120px max(16px,env(safe-area-inset-left));perspective:1200px}
.top{display:flex;justify-content:space-between;align-items:baseline;font-family:"Exo 2",sans-serif}
.top b{font-weight:600;font-size:26px;letter-spacing:.35em;background:linear-gradient(90deg,var(--c),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.top span{font-size:28px;font-weight:300;font-variant-numeric:tabular-nums}
.date{font-family:"Exo 2",sans-serif;font-size:12px;letter-spacing:.2em;color:var(--mut);text-align:right}
.holo{position:relative;height:230px;margin:10px 0 6px;display:grid;place-items:center}
.cube{width:120px;height:120px;position:relative;transform-style:preserve-3d;animation:spin 14s linear infinite}
.cube i{position:absolute;inset:0;border:1px solid rgba(143,243,255,.7);background:rgba(143,243,255,.06);box-shadow:inset 0 0 20px rgba(143,243,255,.35)}
.cube i:nth-child(1){transform:translateZ(60px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(60px)}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(60px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(60px)}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(60px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(60px)}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.beam{position:absolute;bottom:0;width:220px;height:40px;border-radius:50%;background:radial-gradient(ellipse,rgba(143,243,255,.55),transparent 70%);filter:blur(4px)}
.beam::before{content:"";position:absolute;left:50%;bottom:20px;width:180px;height:200px;transform:translateX(-50%);background:linear-gradient(0deg,rgba(143,243,255,.22),transparent);clip-path:polygon(35% 100%,65% 100%,100% 0,0 0)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(143,243,255,.06) 0 1px,transparent 1px 4px);pointer-events:none}
.msg{text-align:center;font-size:14px;color:var(--c);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;transform:rotateX(14deg);transform-origin:50% 0}
.card{position:relative;padding:16px;border-radius:18px;text-decoration:none;color:var(--fg);min-height:110px;display:grid;align-content:end;gap:4px;
  background:linear-gradient(140deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 50%,rgba(201,167,255,.10));border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 20px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .25s}
.card:hover{transform:translateZ(30px)}
.card small{font-family:"Exo 2",sans-serif;font-size:11px;letter-spacing:.25em;color:var(--c)}
.card b{font-size:19px}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);background-size:250% 100%;animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,60%{background-position:120% 0}100%{background-position:-120% 0}}
.nu{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;overflow:hidden;border:1px solid rgba(255,255,255,.6);box-shadow:0 0 24px rgba(143,243,255,.7)}
.nu img{width:100%;height:100%;object-fit:cover}
.hop{animation:hop .7s}@keyframes hop{30%{transform:translateY(-18px)}60%{transform:none}}
.back{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));color:var(--mut);font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;backdrop-filter:blur(8px)}
@media (max-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="wrap">
  <div class="top"><b>FINERI</b><span data-time>--:--:--</span></div>
  <div class="date" data-date></div>
  <div class="holo"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="beam"></div><div class="scan"></div></div>
  <div class="msg">「……ホログラム、きれいでしょ。べつに自慢じゃないけど」</div>
  <div class="grid">
    <a class="card" href="#"><small>COMMS</small><b>無名と話す</b></a>
    <a class="card" href="#"><small>MARKET</small><b>相場</b></a>
    <a class="card" href="#"><small>KEIBA</small><b>競馬</b></a>
    <a class="card" href="#"><small>TASKS</small><b>やること</b></a>
    <a class="card" href="#"><small>MEMORY</small><b>記憶庫</b></a>
    <a class="card" href="#"><small>FOREST</small><b>エルフの森</b></a>
  </div>
</div>
<a class="back" href="./">← 見本一覧</a>
<div class="nu"><img src="../nu.jpg" alt="ぬーちゃん"></div>
<script src="common.js"></script></body></html>
